<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#008eaa" />
    <meta name="robots" content="noindex" />
    <title>You're offline | UTS Jitsu</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Nunito Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #ffffff;
        color: #0f1f26;
      }
      main {
        max-width: 24rem;
        text-align: center;
      }
      img {
        width: 8rem;
        height: auto;
        margin: 0 auto 1.5rem;
        display: block;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #56656c;
      }
      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.625rem;
        background: #008eaa;
        color: #ffffff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.625rem 1.25rem;
        cursor: pointer;
      }
      button:hover {
        background: #007b93;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="UTS Jitsu" />
      <h1>You're offline</h1>
      <p>
        This page needs a connection. Check your signal or wi-fi, then try again. Anything you
        already had open should still work.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
