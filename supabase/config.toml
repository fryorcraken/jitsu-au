# ---------------------------------------------------------------------------
# Everything below is written for the LOCAL stack — the throwaway containers
# `supabase start` / `supabase db start` bring up on a developer's machine and
# in CI (.github/workflows/pr-screenshots.yml, .github/workflows/supabase-lint.yml).
# Nothing in this repository applies any of it to the hosted project, which is
# configured in the Supabase dashboard.
#
# ⚠️  `supabase config push` WOULD apply it, to the project named by
# `project_id` above. Do not run it: it would set the live site's `site_url` to
# a loopback address and turn off email confirmations, which between them break
# every auth email the club sends. If the hosted project ever does need to be
# configured from this file, the [auth] block below has to be reworked first —
# its values exist to let a CI container redirect to a CI port.
# ---------------------------------------------------------------------------

[auth]
# Where the screenshot job serves the built site (scripts/pr-screenshots.mjs,
# PR_SCREENSHOTS_PORT). GoTrue refuses to redirect anywhere it has not been
# told about, and signing a persona in is exactly such a redirect — so moving
# the port means moving these too.
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173"]

[auth.email]
# Nobody reads a confirmation inbox in CI. Seeded people are created already
# confirmed (pr-screenshots-seed.mjs) and sign in straight away.
enable_confirmations = false

[db.seed]
# The fixture is a script, not SQL (scripts/pr-screenshots-seed.mjs): it has to
# create auth users through the Auth API before it can reference them. Off, so
# the CLI stops warning about the supabase/seed.sql that will never exist.
enabled = false

# Containers nothing in this repo talks to locally. Off means a smaller, faster
# `supabase start` — the screenshot job pays for this on every pull request.
[studio]
enabled = false

[local_smtp]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
