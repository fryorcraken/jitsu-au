[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any. An exempt package this repo lists is pinned exactly, so
# no new release arrives unchosen. vite-tanstack-config now carries its dev
# server plugins inside itself, so its entry covers those too. webhooks-js is
# not in package.json: email-js pins it exactly, so without this a fresh
# email-js release would fail to install. scripts/release-age-excludes.test.ts
# holds the list to both rules.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/email-js", "@lovable.dev/webhooks-js"]
