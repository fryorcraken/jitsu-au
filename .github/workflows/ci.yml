name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves private-repo Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo. Without this block the
# job inherits the repository default token scope (often read/write).
permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Lovable pins tarball URLs to its private mirror (unreachable in CI), so
      # a plain `bun install` 403s here. This helper rewrites the pinned base
      # URL to public npm and installs Lovable's exact locked versions, then
      # restores bun.lock. See CLAUDE.md > Lock file strategy.
      - name: Install dependencies
        run: bash scripts/bun-install.sh

      # Surface known-vulnerable dependencies without blocking the build:
      # advisories often land on transitive deps with no fix available yet, and
      # upgrades here must go through package.json -> Lovable re-resolve (see
      # CLAUDE.md > Lock file strategy), not a CI-side lockfile edit.
      - name: Audit dependencies
        run: bun audit
        continue-on-error: true

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
