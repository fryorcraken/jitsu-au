name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves private-repo Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo. Without this block the
# job inherits the repository default token scope (often read/write).
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # This repo is going public and `.env` is tracked (Lovable generates it and
      # re-commits it, so it cannot just be gitignored). That makes it the easiest
      # file in the tree to leak a credential through, and nothing else here would
      # notice. Checked before the install so a leak fails in seconds, and against
      # what git has rather than the working copy — a local service-role key is
      # fine, committing one is not. See CLAUDE.md > Environment variables.
      - name: Check the committed .env holds only publishable values
        run: bun scripts/check-committed-env.mjs

      # Lovable pins tarball URLs to its private mirror (unreachable in CI), so
      # a plain `bun install` 403s here. This helper rewrites the pinned base
      # URL to public npm and installs Lovable's exact locked versions, then
      # restores bun.lock. See CLAUDE.md > Lock file strategy.
      - name: Install dependencies
        run: bash scripts/bun-install.sh

      # Surface known-vulnerable dependencies without blocking the build:
      # advisories often land on transitive deps with no fix available yet, and
      # upgrades here must go through package.json -> Lovable re-resolve (see
      # CLAUDE.md > Lock file strategy), not a CI-side lockfile edit.
      - name: Audit dependencies
        run: bun audit
        continue-on-error: true

      - name: Lint
        run: bun run lint

      # `vite build` is a Rollup bundle: it strips types without checking them,
      # so a type error alone will NOT fail the build step below. This is the
      # step that catches them — including a query against a column the live
      # database no longer has, now that the row types come from the generated
      # (live-schema-derived) types. See docs/database-changes.md.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Both checkers' own matching logic, guarded by inline fixtures. No
      # database, so they are safe to run on PR-authored code. The checks
      # themselves are run by hand against the live database (they cannot run in
      # CI — see supabase/lint/README.md), so this is the only automated thing
      # standing behind them: it proves the matching logic still works before
      # somebody relies on its answer. See CLAUDE.md > Schema drift.
      - name: Self-test the migration drift checker
        run: python3 supabase/lint/check-migration-drift.py --selftest

      - name: Self-test the client grants checker
        run: python3 supabase/lint/check-client-grants.py --selftest
