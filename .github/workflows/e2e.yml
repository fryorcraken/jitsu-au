name: End-to-end tests

# Walks the site's user flows in a real browser: the public funnel, the sign-in
# gate, the member area and the manager screens. What the unit suite cannot
# reach — SSR, the server functions, RLS, the router's own redirects — is
# exactly what is under test here.
#
# It is ALSO where the pull request's screenshots come from. Every test is
# photographed as it goes and the `tour` projects open every page there is, so
# one run produces both the proof that the site works and the pictures a
# reviewer looks at — the flow as it was walked, not a set of pages photographed
# cold by a second program. scripts/e2e-gallery.ts lays that out, and the
# gallery is published to GitHub Pages under `pr-<n>/` so it opens in a browser
# instead of being downloaded and unzipped.
#
# Like the screenshot job, it runs the whole site against a THROWAWAY LOCAL
# SUPABASE STACK: `supabase start` brings up Postgres, Auth, PostgREST and
# Storage, every migration in supabase/migrations is applied to it, and
# scripts/seed-local-club.mjs fills it with a manager, a member and an
# applicant. Nothing here touches the hosted project and the job needs no
# repository secrets — the local stack's keys are the CLI's own development
# keys, printed by `supabase status`.
#
# docs/e2e-tests.md has the local equivalent (`bash scripts/e2e.sh`).

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Read the code, write the Pages branch, write the one sticky comment.
permissions:
  contents: write
  pull-requests: write

jobs:
  e2e:
    name: Walk the user flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same lockfile-preserving install CI uses. See CLAUDE.md > Lock file strategy.
      - name: Install dependencies
        run: bash scripts/bun-install.sh

      # Playwright is deliberately NOT in package.json (CLAUDE.md > Lock file
      # strategy): installing it here leaves the committed lockfile alone, and
      # the checkout is thrown away at the end of the job. The version is pinned
      # in one file so this job and the screenshot job never drift onto
      # different browsers.
      - name: Install Playwright
        run: |
          bun add --no-save "@playwright/test@$(cat scripts/playwright-version.txt)"
          bunx playwright install --with-deps chromium

      # The tests import @playwright/test, so they are outside the app's
      # tsconfig and `bun run typecheck` never sees them. This is the only place
      # a type error in them is caught — before the suite, so a broken test
      # fails as a type error rather than as a mystery timeout.
      - name: Typecheck the tests
        run: bunx tsc -p e2e/tsconfig.json

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Brings up the local stack and applies every migration in order, so the
      # flows are walked against the schema THIS BRANCH ships.
      - name: Start local Supabase (applies every migration)
        run: supabase start

      # The build bakes VITE_* in at bundle time and the Nitro server reads the
      # unprefixed names at runtime, so both spellings have to be set before the
      # build. The tests read them too, to sign the personas in.
      - name: Point the build at the local stack
        run: |
          eval "$(supabase status -o env)"
          : "${API_URL:?supabase status reported no API_URL}"
          : "${ANON_KEY:?supabase status reported no ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status reported no SERVICE_ROLE_KEY}"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed the club
        run: bun scripts/seed-local-club.mjs

      # NITRO_PRESET overrides the Cloudflare default so the build produces a
      # server Playwright's webServer can run directly.
      - name: Build
        run: NITRO_PRESET=node-server bun run build

      # `continue-on-error` so a red suite still produces its gallery and its
      # comment: the screenshot of the step that failed is the most useful thing
      # in the run, and a reviewer should not have to dig through a job log for
      # it. The job is failed at the end instead.
      - name: Run the end-to-end tests
        id: tests
        continue-on-error: true
        run: bunx playwright test

      # Lays the run out as one page: the flows as strips of screens in the
      # order they were walked, then every page at desktop and phone width.
      - name: Build the gallery
        id: gallery
        if: always()
        continue-on-error: true
        env:
          PUBLISHABLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=("--commit=${HEAD_SHA:0:7}")
          # Only claim an address the run will actually be published to. A fork
          # cannot push the Pages branch, so its comment links nothing rather
          # than linking a 404.
          if [ "$PUBLISHABLE" = "true" ]; then args+=("--base-url=$PAGES_URL"); fi
          bun scripts/e2e-gallery.ts "${args[@]}"

      # Everything the run produced, for a fork (which cannot publish) and for
      # anyone who wants the originals rather than the page.
      - name: Upload the gallery
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: e2e-gallery-${{ github.run_id }}
          path: gallery
          retention-days: 14

      # One directory per pull request on the Pages branch, so two open pull
      # requests never overwrite each other. .github/workflows/pr-gallery-cleanup.yml
      # takes it down again when the pull request closes.
      - name: Publish the gallery to GitHub Pages
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/publish-pr-gallery.sh

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        continue-on-error: true
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            // github-script v8 is ESM, so this is `import`, never `require`.
            const fs = await import("node:fs");
            const marker = "<!-- e2e-gallery -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // No comment.md means the run never got as far as photographing
            // anything (no stack, no build), which is a different thing to tell
            // a reviewer than "a screen is broken".
            const gallery = fs.existsSync("gallery/comment.md")
              ? fs.readFileSync("gallery/comment.md", "utf8")
              : [
                  "### 📸 What this branch looks like",
                  "",
                  `The run failed before it walked anything. [See the job log](${runUrl}).`,
                ].join("\n");

            const artifactUrl = process.env.ARTIFACT_URL;
            const footer = artifactUrl
              ? `<sub>[Download this run](${artifactUrl}) (zip, kept 14 days) · [job log](${runUrl})</sub>`
              : `<sub>[Job log](${runUrl})</sub>`;

            const body = [marker, gallery, "", footer].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # The suite's own result, after the comment above has gone out saying what
      # broke and showing the screen it broke on.
      - name: Fail if the suite did not pass
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error title=End-to-end tests::A flow or a page failed. See the gallery comment on the pull request."
          exit 1
