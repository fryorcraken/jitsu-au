name: PR screenshots

# Photographs every public page of the site as this branch builds it, at
# desktop and phone widths, and posts the result on the pull request. Reviewing
# a copy or layout change then means looking at the page instead of reading the
# diff and imagining it.
#
# The repository is private, so GitHub will not render images pulled from
# `raw.githubusercontent.com` inside a comment (they need an authenticated
# request). The screenshots therefore ship as a build artifact and the comment
# links to it: download, unzip, open `index.html`.
#
# Needs two repository secrets, both of which are values the deployed site
# already ships to every visitor in its JavaScript bundle:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# Without them the pages that read plans, blog posts or the calendar render as
# error pages, so the job skips itself with a notice instead of posting
# misleading screenshots.

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "supabase/**"

# Superseded runs are pointless here: only the newest push is being reviewed.
concurrency:
  group: pr-screenshots-${{ github.ref }}
  cancel-in-progress: true

# Read the code, write the one sticky comment. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  screenshots:
    name: Screenshot public pages
    runs-on: ubuntu-latest
    env:
      # Build-time (browser bundle) and run-time (SSR) names for the same two
      # values. src/integrations/supabase/client.ts reads whichever it finds.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Pinned so the browser Playwright downloads matches the driver that
      # drives it. Bump both by bumping this one line.
      PLAYWRIGHT_VERSION: 1.62.1
    steps:
      - uses: actions/checkout@v7

      # `secrets` is not available in a job-level `if`, so the skip decision is
      # a step that every later step keys off.
      - name: Check Supabase secrets are configured
        id: config
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=PR screenshots skipped::Set the VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY repository secrets to enable screenshots."
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.config.outputs.ready == 'true'
        with:
          bun-version: latest

      # Same lockfile-preserving install CI uses. See CLAUDE.md > Lock file strategy.
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: bash scripts/bun-install.sh

      # Playwright is deliberately NOT in package.json: dependencies there have
      # to be re-resolved by Lovable (CLAUDE.md > Lock file strategy), and this
      # is a CI-only tool. Installing it here leaves the committed lockfile
      # alone — the checkout is thrown away at the end of the job.
      - name: Install Playwright
        if: steps.config.outputs.ready == 'true'
        run: |
          bun add --no-save "playwright@${PLAYWRIGHT_VERSION}"
          bunx playwright install --with-deps chromium

      # NITRO_PRESET overrides the Cloudflare default so the build produces a
      # server this runner can execute directly.
      - name: Build
        if: steps.config.outputs.ready == 'true'
        run: NITRO_PRESET=node-server bun run build

      - name: Capture screenshots
        id: shots
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        run: bun scripts/pr-screenshots.mjs

      - name: Upload screenshots
        id: artifact
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots-${{ github.event.pull_request.number }}
          path: screenshots
          retention-days: 14

      # Read through the environment rather than the filesystem so the comment
      # script below stays free of `require`, which newer github-script majors
      # (ESM-only) no longer provide.
      - name: Collect the summary table
        if: steps.config.outputs.ready == 'true'
        run: |
          {
            echo 'SCREENSHOT_SUMMARY<<PR_SCREENSHOTS_EOF'
            if [ -f screenshots/summary.md ]; then
              cat screenshots/summary.md
            else
              echo '_No screenshots were produced — see the job log._'
            fi
            echo 'PR_SCREENSHOTS_EOF'
          } >> "$GITHUB_ENV"

      - name: Comment on the pull request
        if: steps.config.outputs.ready == 'true'
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          SHOTS_OUTCOME: ${{ steps.shots.outcome }}
        with:
          script: |
            const marker = "<!-- pr-screenshots -->";
            const summary = process.env.SCREENSHOT_SUMMARY ?? "";
            const failed = process.env.SHOTS_OUTCOME === "failure";
            const heading = failed
              ? "### 📸 Page screenshots — some pages failed to render"
              : "### 📸 Page screenshots";

            // Falls back to the run itself if the upload step produced no URL.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = process.env.ARTIFACT_URL || runUrl;

            const body = [
              marker,
              heading,
              "",
              `[**Download the screenshots**](${artifactUrl}) (zip, kept 14 days).`,
              "Unzip it and open `index.html` to see every page at desktop and phone width on one page.",
              "",
              summary.trim(),
              "",
              `<sub>Built from ${context.payload.pull_request.head.sha.slice(0, 7)}.</sub>`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # A page that 500s is a real breakage, not a screenshot problem, so the
      # job goes red — but only after the comment above has gone out saying
      # which page it was.
      - name: Fail if any page did not render
        if: steps.config.outputs.ready == 'true' && steps.shots.outcome == 'failure'
        run: |
          echo "::error title=PR screenshots::One or more public pages failed to render. See the job log above."
          exit 1
