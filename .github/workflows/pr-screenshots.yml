name: PR screenshots

# Photographs every page of the site as this branch builds it — the public
# pages, the member area and the manager screens — at desktop and phone widths,
# and posts the result on the pull request. Reviewing a copy or layout change
# then means looking at the page instead of reading the diff and imagining it.
#
# The signed-in screens need a database with people in it, so the job runs the
# whole site against a THROWAWAY LOCAL SUPABASE STACK: `supabase start` brings
# up Postgres, Auth, PostgREST and Storage, every migration in
# supabase/migrations is applied to it, and scripts/seed-local-club.mjs
# fills it with a small club (a manager, a member, an applicant, and the rows
# the manager screens list). Nothing here touches the hosted project, and the
# job needs no repository secrets: the local stack's keys are the CLI's own
# well-known development keys, printed by `supabase status`.
#
# One consequence worth knowing when you read the artifact: /blog, /pricing and
# the calendar show the SEEDED content, not what is on jitsu.au today. That is
# the trade for screenshots that are the same on every run and on every fork.
#
# The screenshots ship as a build artifact and the comment links to it, rather
# than being embedded inline: an Actions artifact is a zip you download, not a
# URL a comment can render an image from. So: download, unzip, open
# `index.html`.

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# Superseded runs are pointless here: only the newest push is being reviewed.
concurrency:
  group: pr-screenshots-${{ github.ref }}
  cancel-in-progress: true

# Read the code, write the one sticky comment. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  screenshots:
    name: Screenshot every page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same lockfile-preserving install CI uses. See CLAUDE.md > Lock file strategy.
      - name: Install dependencies
        run: bash scripts/bun-install.sh

      # Playwright is deliberately NOT in package.json: dependencies there have
      # to be re-resolved by Lovable (CLAUDE.md > Lock file strategy), and this
      # is a CI-only tool. Installing it here leaves the committed lockfile
      # alone — the checkout is thrown away at the end of the job.
      #
      # The version is pinned in scripts/playwright-version.txt so the browser
      # Playwright downloads matches the driver that drives it, and so this job
      # and the end-to-end tests never drift onto different browsers.
      - name: Install Playwright
        run: |
          bun add --no-save "playwright@$(cat scripts/playwright-version.txt)"
          bunx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Brings up the local stack and applies every migration in order, so the
      # screenshots are of the schema THIS BRANCH ships. A migration that fails
      # to apply fails here, before anything is photographed.
      - name: Start local Supabase (applies every migration)
        run: supabase start

      # The local keys are printed, not secret. The build bakes VITE_* in at
      # bundle time and the Nitro server reads the unprefixed names at runtime,
      # so both spellings of the same two values have to be set before `build`.
      - name: Point the build at the local stack
        run: |
          eval "$(supabase status -o env)"
          : "${API_URL:?supabase status reported no API_URL}"
          : "${ANON_KEY:?supabase status reported no ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status reported no SERVICE_ROLE_KEY}"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Writes .local-club-fixture.json, which is how the screenshot script
      # knows there is a database to sign in against and who to sign in as.
      - name: Seed the club
        run: bun scripts/seed-local-club.mjs

      # NITRO_PRESET overrides the Cloudflare default so the build produces a
      # server this runner can execute directly.
      - name: Build
        run: NITRO_PRESET=node-server bun run build

      - name: Capture screenshots
        id: shots
        continue-on-error: true
        run: bun scripts/pr-screenshots.mjs

      - name: Upload screenshots
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pr-screenshots-${{ github.event.pull_request.number }}
          path: screenshots
          retention-days: 14

      # Read through the environment rather than the filesystem so the comment
      # script below stays free of `require`, which newer github-script majors
      # (ESM-only) no longer provide.
      # `always()` from here down: `supabase start` and the seed are hard-failure
      # steps ahead of the screenshots, and a reviewer who gets NO comment has
      # to go digging in the Actions tab to find out why.
      - name: Collect the summary table
        if: always()
        run: |
          {
            echo 'SCREENSHOT_SUMMARY<<PR_SCREENSHOTS_EOF'
            if [ -f screenshots/summary.md ]; then
              cat screenshots/summary.md
            else
              echo '_The run never reached the pages — see the job log._'
            fi
            echo 'PR_SCREENSHOTS_EOF'
          } >> "$GITHUB_ENV"
          # A missing summary means the script died before photographing
          # anything (no server, no browser), which is a different thing to
          # tell a reviewer than "a page is broken".
          if [ -f screenshots/summary.md ]; then
            echo "SCREENSHOTS_CAPTURED=true" >> "$GITHUB_ENV"
          else
            echo "SCREENSHOTS_CAPTURED=false" >> "$GITHUB_ENV"
          fi

      - name: Comment on the pull request
        if: always()
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          SHOTS_OUTCOME: ${{ steps.shots.outcome }}
        with:
          script: |
            const marker = "<!-- pr-screenshots -->";
            const summary = process.env.SCREENSHOT_SUMMARY ?? "";
            const failed = process.env.SHOTS_OUTCOME === "failure";
            // A failure with no summary file never got as far as the pages, so
            // it is a broken run, not a broken page. Saying "some pages failed
            // to render" would send a reviewer hunting a bug that isn't there.
            const captured = process.env.SCREENSHOTS_CAPTURED === "true";

            // Falls back to the run itself if the upload step produced no URL.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = process.env.ARTIFACT_URL || runUrl;

            const heading = !failed
              ? "### 📸 Page screenshots"
              : captured
                ? "### 📸 Page screenshots — some pages failed to render"
                : "### 📸 Page screenshots — the run failed before photographing anything";

            const intro = captured
              ? [
                  `[**Download the screenshots**](${artifactUrl}) (zip, kept 14 days).`,
                  "Unzip it and open `index.html` to see every page at desktop and phone width on one page.",
                  "Signed-in screens are shot against a seeded local database, so the content is fixture data, not the live club.",
                ]
              : [`[**See the job log**](${runUrl}) for what went wrong.`];

            const body = [
              marker,
              heading,
              "",
              ...intro,
              "",
              summary.trim(),
              "",
              `<sub>Built from ${context.payload.pull_request.head.sha.slice(0, 7)}.</sub>`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # A page that 500s is a real breakage, not a screenshot problem, so the
      # job goes red — but only after the comment above has gone out saying
      # which page it was.
      - name: Fail if the run did not come back clean
        if: steps.shots.outcome == 'failure'
        run: |
          if [ "$SCREENSHOTS_CAPTURED" = "true" ]; then
            echo "::error title=PR screenshots::One or more pages failed to render. See the job log above."
          else
            echo "::error title=PR screenshots::The screenshot run failed before it photographed any page. See the job log above."
          fi
          exit 1
