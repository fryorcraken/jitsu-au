name: Deploy the galleries

# Publishes whatever the gallery store branch holds — every open pull request's
# screenshots — to GitHub Pages.
#
# Why this is its own workflow rather than one more job on the run that made the
# gallery: GitHub's `github-pages` environment only accepts deployments from the
# DEFAULT BRANCH. A job on a pull request's branch is refused before it starts —
# no runner, no steps, no log, just a red check — which is exactly what happened
# the first time this was tried. A `workflow_run` workflow always runs in the
# default branch's context, so it is allowed.
#
# Two consequences of that trigger, both deliberate:
#
#   - `workflow_run` only fires from the copy of this file on the default
#     branch. Until this lands on `main` nothing deploys, and the pull request
#     that introduces it cannot see its own gallery published.
#   - It runs the file as `main` has it, against the store branch as it is NOW.
#     So a run that finished while another was still walking the site is carried
#     along rather than reverted: the deployment is of the whole store, never of
#     one run's idea of it.

on:
  workflow_run:
    workflows:
      - "End-to-end tests"
      - "Take down a closed pull request's gallery"
    types: [completed]

# Read the store branch, deploy it. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages takes one deployment at a time and this is the only thing that deploys,
# so runs queue rather than cancelling each other: a cancelled deployment would
# leave the site without the gallery that was just pushed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        id: store
        with:
          ref: gh-pages
        # Nothing to deploy until a gallery has been pushed: the store branch
        # does not exist before the first one.
        continue-on-error: true

      - name: Say there is nothing to deploy
        if: steps.store.outcome != 'success'
        run: echo "::notice title=Galleries::No gh-pages store branch yet, so there is nothing to publish."

      - name: Upload the site
        if: steps.store.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        if: steps.store.outcome == 'success'
        uses: actions/deploy-pages@v4
